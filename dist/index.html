<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>윤아맘의 슬라임퇴치</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="start-screen">
    <h1>윤아맘의 슬라임퇴치</h1>
    <p>슬라임을 통통 쳐서 무찌르자!</p>
    <button id="start-btn">시작하기</button>
  </div>

  <div id="hud" class="hidden">
    <div id="level-wrap">
      <span class="hud-label">레벨 <span id="level-num">1</span></span>
      <div id="xp-bar-bg"><div id="xp-bar-fill"></div></div>
    </div>
    <div id="hud-right">
      <button id="music-btn" aria-label="음악 켜기/끄기">🔊</button>
      <div id="score">쓰러뜨린 슬라임: <span id="score-num">0</span></div>
    </div>
  </div>

  <div id="level-up-toast"></div>

  <div id="mobile-controls" class="hidden">
    <div id="joystick-zone">
      <div id="joystick-base"><div id="joystick-knob"></div></div>
    </div>
    <button id="attack-btn">공격!</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
